{% extends "painel/base.html" %}

{% block title %}Detalhes do Banner{% endblock %}

{% block content %}
<h2>{{ banner.titulo }}</h2>

<p><strong>Texto:</strong> {{ banner.texto }}</p>
<p><strong>Link:</strong> {{ banner.link }} ({{ banner.texto_link }})</p>
<p><strong>Ativo:</strong> {{ banner.ativo }}</p>

{% if banner.imagem %}
<p><strong>Imagem:</strong><br>
<img src="{{ banner.imagem.url }}" style="max-width:300px;"></p>
{% endif %}

<a href="{% url 'painel:homebanner-edit' banner.id %}" style="display:inline-block; margin-top:10px; padding:6px 12px; background:#0d6efd; color:#fff; text-decoration:none; border-radius:4px;">Editar</a>
{% endblock %}

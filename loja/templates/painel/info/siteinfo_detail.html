{% extends "painel/base.html" %}

{% block title %}Detalhes do Site{% endblock %}

{% block content %}
<h2>{{ info.nome }}</h2>

{% if info.logo %}
<p><strong>Logo:</strong><br>
<img src="{{ info.logo.url }}" style="max-width:200px;"></p>
{% endif %}

<a href="{% url 'painel:siteinfo-edit' info.id %}" style="display:inline-block; margin-top:10px; padding:6px 12px; background:#0d6efd; color:#fff; text-decoration:none; border-radius:4px;">Editar</a>
{% endblock %}
